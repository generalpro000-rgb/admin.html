<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER CONTROL | لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        .gate { border: 2px solid #00ff41; padding: 40px; margin-top: 100px; display: inline-block; }
        .dashboard { display: none; text-align: right; max-width: 600px; margin: auto; }
        .card { border: 1px solid #00ff41; padding: 15px; margin: 10px 0; background: #0a0a0a; }
        button { background: #00ff41; color: #000; border: none; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-red { background: #ff3e3e; color: #fff; }
        input { background: #000; border: 1px solid #00ff41; color: #fff; padding: 10px; margin: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="login-gate" class="gate">
        <h2>نظام ماهر السري 🔐</h2>
        <input type="password" id="admin-pass" placeholder="كلمة السر">
        <button onclick="check()">دخول</button>
    </div>

    <div id="admin-dash" class="dashboard">
        <h1>التحكم المركزي ⚙️</h1>
        <h2>📥 طلبات تفعيل D17</h2>
        <div id="req-list">جاري التحميل...</div>
        
        <h2>💰 طلبات سحب الأرباح</h2>
        <div id="win-list">لا توجد طلبات.</div>
    </div>

<script>
    const KEY = "MAHER2024";
    const firebaseConfig = { databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function check() {
        if(document.getElementById('admin-pass').value === KEY) {
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('admin-dash').style.display = 'block';
            load();
        } else { alert("خطأ!"); }
    }

    function load() {
        // قراءة الطلبات من active_requests
        db.ref('active_requests').on('value', (s) => {
            const list = document.getElementById('req-list');
            list.innerHTML = '';
            s.forEach((child) => {
                const d = child.val();
                list.innerHTML += `<div class="card">
                    كود: <b>${d.code}</b> | حالة: ${d.approved ? '✅' : '⏳'}<br>
                    <button onclick="approve('${child.key}')">تفعيل الحساب ✅</button>
                    <button class="btn-red" onclick="del('active_requests','${child.key}')">حذف ❌</button>
                </div>`;
            });
        });

        // قراءة طلبات السحب
        db.ref('withdraw_requests').on('value', (s) => {
            const list = document.getElementById('win-list');
            list.innerHTML = '';
            s.forEach((child) => {
                const d = child.val();
                list.innerHTML += `<div class="card" style="border-color:red">
                    هاتف: ${d.phone} | نقاط: ${d.points}<br>
                    <button class="btn-red" onclick="del('withdraw_requests','${child.key}')">تم الدفع ✅</button>
                </div>`;
            });
        });
    }

    function approve(id) { db.ref('active_requests/' + id).update({ approved: true }); alert("تم!"); }
    function del(p, id) { if(confirm("حذف؟")) db.ref(p + '/' + id).remove(); }
</script>
</body>
</html>
