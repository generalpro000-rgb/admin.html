<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER ADMIN | لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; text-align: center; }
        .login-gate { border: 2px solid #00ff41; padding: 40px; display: inline-block; margin-top: 100px; }
        .dashboard { display: none; text-align: right; max-width: 800px; margin: auto; }
        .card { border: 1px solid #00ff41; padding: 15px; margin: 10px 0; background: #0a0a0a; }
        input { background: #000; border: 1px solid #00ff41; color: #fff; padding: 10px; margin: 10px; }
        button { background: #00ff41; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .btn-red { background: #ff3e3e; color: #fff; }
        h2 { border-bottom: 2px solid #00ff41; padding-bottom: 10px; }
    </style>
</head>
<body>

    <div id="gate" class="login-gate">
        <h2>الدخول للنظام 🔐</h2>
        <input type="password" id="pass" placeholder="كلمة السر">
        <br>
        <button onclick="login()">دخول</button>
    </div>

    <div id="dash" class="dashboard">
        <h1>لوحة تحكم ماهر ⚙️</h1>
        
        <h2>📥 طلبات التفعيل الجديدة</h2>
        <div id="active-list">جاري التحميل...</div>

        <h2>💰 طلبات السحب (1000 نقطة)</h2>
        <div id="withdraw-list">لا توجد طلبات سحب.</div>
    </div>

<script>
    // كلمة السر الخاصة بك
    const SECRET = "MAHER2024"; 

    function login() {
        if(document.getElementById('pass').value === SECRET) {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            startAdmin();
        } else { alert("خطأ في كلمة السر!"); }
    }

    const firebaseConfig = { databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function startAdmin() {
        // مراقبة طلبات التفعيل
        db.ref('active_requests').on('value', (snap) => {
            const list = document.getElementById('active-list');
            list.innerHTML = '';
            snap.forEach((child) => {
                const d = child.val();
                list.innerHTML += `<div class="card">
                    كود D17: <b>${d.code}</b> | حالة: ${d.approved ? '✅ مفعل' : '⏳ معلق'}<br>
                    <button onclick="approve('${child.key}')">موافقة وتفعيل ✅</button>
                    <button class="btn-red" onclick="remove('active_requests','${child.key}')">حذف ❌</button>
                </div>`;
            });
        });

        // مراقبة طلبات السحب
        db.ref('withdraw_requests').on('value', (snap) => {
            const list = document.getElementById('withdraw-list');
            list.innerHTML = '';
            snap.forEach((child) => {
                const d = child.val();
                list.innerHTML += `<div class="card" style="border-color:red">
                    هاتف: <b>${d.phone}</b> | نقاط: ${d.points}<br>
                    <button class="btn-red" onclick="remove('withdraw_requests','${child.key}')">تم الدفع (حذف الطلب) ✅</button>
                </div>`;
            });
        });
    }

    function approve(id) { db.ref('active_requests/' + id).update({ approved: true }); alert("تم التفعيل!"); }
    function remove(path, id) { if(confirm("حذف؟")) db.ref(path + '/' + id).remove(); }
</script>
</body>
</html>
