<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAHER ADMIN | SECURE ACCESS</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --neon: #00ff41; }
        body { background: #000; color: var(--neon); font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-box { border: 2px solid var(--neon); padding: 30px; text-align: center; background: #050505; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        .admin-content { display: none; width: 90%; max-width: 600px; padding: 20px; }
        .card { border: 1px solid var(--neon); padding: 15px; margin-bottom: 20px; background: #0a0a0a; position: relative; }
        input { background: #000; border: 1px solid var(--neon); color: #fff; padding: 10px; width: 80%; margin-bottom: 10px; text-align: center; }
        button { background: var(--neon); color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .btn-approve { background: #00ff41; margin-top: 10px; width: 100%; }
        .btn-delete { background: #ff3e3e; color: #fff; margin-top: 5px; width: 100%; }
        h2 { border-bottom: 1px solid var(--neon); padding-bottom: 10px; font-size: 1.2rem; }
        .badge { color: #888; font-size: 0.7rem; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="login-gate" class="login-box">
        <h2>نظام إدارة ماهر 🔐</h2>
        <p>أدخل مفتاح العبور المشفر:</p>
        <input type="password" id="admin-pass" placeholder="PASSWORD">
        <br>
        <button onclick="checkPass()">دخول النظام</button>
    </div>

    <div id="admin-main" class="admin-content">
        <h1 style="text-align: center;">لوحة التحكم المركزية ⚙️</h1>
        
        <h2>🔔 طلبات التفعيل (D17)</h2>
        <div id="activation-list">جاري المزامنة...</div>

        <h2>💰 طلبات السحب المعلقة</h2>
        <div id="withdraw-list">لا توجد طلبات.</div>
        
        <button onclick="location.reload()" style="background:#222; color:#fff; width:100%; margin-top:20px;">تحديث البيانات 🔄</button>
    </div>

<script>
    // كلمة السر الخاصة بك (يمكنك تغييرها من هنا)
    const MASTER_PASS = "MAHER2024"; 

    function checkPass() {
        const input = document.getElementById('admin-pass').value;
        if (input === MASTER_PASS) {
            document.getElementById('login-gate').style.display = 'none';
            document.getElementById('admin-main').style.display = 'block';
            loadData();
        } else {
            alert("⚠️ اختراق مكتشف! كلمة السر خاطئة.");
        }
    }

    const firebaseConfig = { databaseURL: "https://m-token-5ce65-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function loadData() {
        // تحميل طلبات التفعيل
        db.ref('active_requests').on('value', (snapshot) => {
            const list = document.getElementById('activation-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="card">
                        <p>📦 كود العملية: <strong>${data.code}</strong></p>
                        <span class="badge">الوقت: ${data.time || 'غير مسجل'}</span>
                        <button class="btn-approve" onclick="approve('${child.key}')">تفعيل الحساب ✅</button>
                        <button class="btn-delete" onclick="removeReq('active_requests', '${child.key}')">حذف الطلب ❌</button>
                    </div>`;
            });
            if (!list.innerHTML) list.innerHTML = "<p style='color:#666'>لا توجد طلبات تفعيل حالياً.</p>";
        });

        // تحميل طلبات السحب
        db.ref('withdraw_requests').on('value', (snapshot) => {
            const list = document.getElementById('withdraw-list');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="card" style="border-color: #ff3e3e;">
                        <p>📱 هاتف المستلم: <strong>${data.phone}</strong></p>
                        <p>💵 المبلغ المستحق: 10 DT (${data.points} نقطة)</p>
                        <button class="btn-delete" onclick="removeReq('withdraw_requests', '${child.key}')">تم الدفع (مسح من القائمة) ✅</button>
                    </div>`;
            });
        });
    }

    function approve(id) {
        db.ref('active_requests/' + id).update({ approved: true });
        alert("تم التفعيل بنجاح!");
    }

    function removeReq(path, id) {
        if(confirm("هل تريد حذف هذا السجل نهائياً؟")) {
            db.ref(path + '/' + id).remove();
        }
    }
</script>
</body>
</html>
